<section class="screen" id="s-formulieren">
  <div class="hdr sm">
    <button class="back" onclick="goBack()" aria-label="Terug">‹</button>
    <h1 tabindex="-1">Formulieren invullen</h1>
  </div>
  <main>
    <div class="card">
      <label class="f" for="pff-keuze">Formulier</label>
      <select class="search" id="pff-keuze" onchange="fmKies(this.value)"></select>
      <p class="note" id="pff-uitleg"></p>
      <p class="note">Je invoer blijft alleen in het geheugen tot je de app sluit of het formulier leegmaakt. Een gemaakte PDF staat tijdelijk onder PDF → Gemaakt. Bewaar hem zelf via Opslaan als…</p>
      <button class="mini" id="pff-bron" onclick="fmBron()">Officiële bron openen</button>
    </div>
    <div class="card">
      <p class="note" id="pff-stap" role="status" aria-live="polite"></p>
      <h2 id="pff-titel" tabindex="-1"></h2>
      <form id="pff-velden" autocomplete="off" novalidate translate="no" onsubmit="event.preventDefault();fmVerder()"></form>
      <div id="pff-controle" hidden>
        <p class="note" id="pff-instructie"></p>
        <div id="pff-samenvatting" translate="no"></div>
        <div class="row pff-navigatie">
          <button class="mini" id="pff-pagina-vorige" onclick="fmPagina(-1)" aria-label="Vorige pagina">‹</button>
          <span class="note" id="pff-pagina-nummer"></span>
          <button class="mini" id="pff-pagina-volgende" onclick="fmPagina(1)" aria-label="Volgende pagina">›</button>
        </div>
        <p class="note" id="pff-preview-status" role="status" aria-live="polite"></p>
        <div class="pff-papier" id="pff-papier" hidden>
          <img id="pff-voorbeeld" alt="Voorbeeld van het ingevulde formulier">
          <canvas id="pff-laag" aria-hidden="true"></canvas>
        </div>
        <label class="f" for="pff-naam">Naam van de nieuwe PDF</label>
        <input class="search" id="pff-naam" maxlength="60" translate="no" autocomplete="off">
      </div>
      <p class="note" id="pff-melding" role="status" aria-live="polite"></p>
      <div class="row pff-navigatie">
        <button class="big ghost" id="pff-vorige" onclick="fmTerug()">Vorige stap</button>
        <button class="big" id="pff-volgende" onclick="fmVerder()">Volgende stap</button>
        <button class="big" id="pff-maak" onclick="fmMaak()" hidden>Ingevulde PDF maken</button>
      </div>
      <button class="mini" id="pff-wissen" onclick="fmWissen()" style="margin-top:16px">Formulier leegmaken</button>
    </div>
    <div class="card" id="pff-resultaat" hidden>
      <h2>Ingevulde PDF</h2>
      <p class="note" id="pff-klaar"></p>
      <p id="pff-bestand" translate="no"></p>
      <div class="row pff-navigatie">
        <button class="big ghost" onclick="Android.pdfOpen(fm.bestand)">Bekijken en afdrukken</button>
        <button class="big" onclick="Android.pdfSave(fm.bestand)">Opslaan als…</button>
        <button class="big ghost" onclick="Android.pdfShare(JSON.stringify([fm.bestand]))">Delen</button>
      </div>
    </div>
  </main>
</section>
