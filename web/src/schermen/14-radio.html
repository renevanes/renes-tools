<!-- ============ RADIO ============ -->
<section class="screen" id="s-radio">
  <div class="hdr">
    <button class="back" onclick="goBack()" aria-label="Terug"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 tabindex="-1">Radio</h1>
  </div>
  <main>
    <div id="rd-favs-wrap">
      <div class="flabel" style="margin:4px 2px 8px">Favorieten</div>
      <div class="card stations" id="rd-favs"></div>
    </div>
    <button class="big ghost" style="margin-bottom:12px" onclick="show('ralarm')" id="rd-alarm-btn">⏰ Radiowekker</button>
    <input class="search" id="rd-search" type="search" placeholder="Zoek een zender…" oninput="rdSearchDo()">
    <div class="flabel" style="margin:4px 2px 8px" id="rd-list-label">Populair in Nederland</div>
    <div class="card stations" id="rd-list"><p class="note" style="padding:14px">Zenders laden…</p></div>
    <p class="note" style="margin-top:14px">Zenders en stream-adressen komen uit de vrije database van radio-browser.info, dus ook gewijzigde adressen van omroepen kloppen. Tik op ☆ om een zender aan je favorieten toe te voegen.</p>
  </main>
</section>
