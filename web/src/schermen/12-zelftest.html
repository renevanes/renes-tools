<!-- ============ ZELFTEST ============ -->
<section class="screen" id="s-selftest">
  <div class="hdr">
    <button class="back" onclick="goBack()" aria-label="Terug"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 tabindex="-1">Zelftest</h1>
  </div>
  <main>
    <div class="card">
      <p class="note" style="margin-top:0">Controleert of alles op deze telefoon werkt: het uitschrijfprogramma, je backup-map, internet en radio, je AudD-sleutel, wekkers, meldingen, batterijbeperking, opslag en toestemmingen. Er worden geen herkenningen verbruikt.</p>
      <button class="big" id="sf-run" onclick="sfRun()">Zelftest starten</button>
      <p class="note" id="sf-when"></p>
    </div>
    <div class="card" id="sf-res-card" style="display:none"><div id="sf-res"></div></div>
    <button class="big ghost" onclick="Android.crashShare()">Rapport delen (met zelftest)</button>
  </main>
</section>
