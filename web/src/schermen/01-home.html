<!-- ============ HOME ============ -->
<section class="screen on" id="s-home">
  <div class="hdr"><h1 tabindex="-1">Rene's Tools</h1><span class="ver" id="hver"></span>
    <button class="hbtn" onclick="show('settings')" aria-label="Instellingen" title="Instellingen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  <main>
    <div class="banner" id="upd-banner"><div id="upd-text">Nieuwe versie beschikbaar</div><button onclick="installUpdate()">Installeren</button></div>
    <div class="tiles" id="tile-pool">
      <button class="tile" id="tile-redial" onclick="show('redial')">
        <span class="dot"></span>
        <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/><path d="M15 2.5a6.5 6.5 0 0 1 6.5 6.5"/><path d="M21.5 3v4h-4"/></svg></span>
        <b>Auto redial</b>
        <small id="tile-redial-sub">Blijft bellen tot er wordt opgenomen</small>
      </button>
      <button class="tile" id="tile-wa" onclick="show('wa')">
        <span class="dot"></span>
        <span class="ic" style="background:#25A35A"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.5 8.5 0 1 1 21 11.5z"/><path d="M12 8v6M9.5 11.5 12 14l2.5-2.5"/></svg></span>
        <b>WhatsApp backup</b>
        <small id="tile-wa-sub">Chats en media veilig bewaren</small>
      </button>
      <button class="tile" id="tile-tracks" onclick="show('tracks')">
        <span class="dot"></span>
        <span class="ic" style="background:#C0392B"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
        <b>Mijn routes</b>
        <small id="tile-tracks-sub">Leg je route vast met gps</small>
      </button>
      <button class="tile" id="tile-sms" onclick="show('sms')">
        <span class="ic" style="background:#8E44AD"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg></span>
        <b>SMS-backup</b>
        <small id="tile-sms-sub">Bewaar je sms-berichten</small>
      </button>
      <button class="tile" id="tile-history" onclick="show('history')">
        <span class="ic" style="background:#B9770E">🔔</span>
        <b>Meldingsgeschiedenis</b>
        <small>Bewaar en backup je meldingen</small>
      </button>
      <button class="tile" id="tile-calls" onclick="show('calls')">
        <span class="ic" style="background:#16A085"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>
        <b>Oproepen-backup</b>
        <small id="tile-calls-sub">Bewaar je belgeschiedenis</small>
      </button>
      <button class="tile" id="tile-notes" onclick="show('notes')">
        <span class="ic" style="background:#E67E22"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2"/><circle cx="5" cy="18" r="1"/></svg></span>
        <b>Notities</b>
        <small id="tile-notes-sub">Lijstjes maken en afstrepen</small>
      </button>
      <button class="tile" id="tile-contacts" onclick="show('contacts')">
        <span class="ic" style="background:#2C3E50"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
        <b>Contacten</b>
        <small id="tile-contacts-sub">Backup, versies en wijzigingen</small>
      </button>
      <button class="tile" id="tile-car" onclick="show('car')">
        <span class="ic" style="background:#1F6F5C">🚗</span>
        <b>Mijn auto</b>
        <small id="tile-car-sub">Parkeerplek en ritten</small>
      </button>
      <button class="tile" id="tile-recorder" onclick="show('recorder')">
        <span class="ic" style="background:#A93226">🎙</span>
        <b>Gesprekken opnemen</b>
        <small>Handmatig of automatisch starten</small>
      </button>
      <button class="tile" id="tile-tr" onclick="show('transcripts')">
        <span class="ic" style="background:#7D3C98"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 10h16M4 14h12M4 18h7"/><path d="M17 15v6M20 17v2M14 17v2"/></svg></span>
        <b>Gesprekken uitschrijven</b>
        <small id="tile-tx-sub">Opnames omzetten naar tekst</small>
      </button>
      <button class="tile" id="tile-radio" onclick="show('radio')">
        <span class="ic" style="background:#D35400"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M7 8l10-5"/><circle cx="8.5" cy="14.5" r="2.5"/><path d="M14 13h4M14 16h4"/></svg></span>
        <b>Radio</b>
        <small id="tile-radio-sub">Nederlandse zenders luisteren</small>
      </button>
      <button class="tile" id="tile-music" onclick="show('music')">
        <span class="ic" style="background:#2471A3"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
        <b>Muziek herkennen</b>
        <small id="tile-music-sub">Welk nummer is dit?</small>
      </button>
      <button class="tile" id="tile-skin" onclick="Android.homeOpen()">
        <span class="ic" style="background:linear-gradient(135deg,#6D28D9,#DB2777)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2"/><path d="M11 18h2"/></svg></span>
        <b>Telefoon-skin</b>
        <small id="tile-skin-sub">Je telefoon in een nieuw jasje</small>
      </button>
      <button class="tile" id="tile-auto" onclick="show('auto')">
        <span class="ic" style="background:#0E7C86"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></span>
        <b>Automatiseringen</b>
        <small id="tile-auto-sub">Bijv. parkeren starten bij aankomst</small>
      </button>
      <button class="tile" id="tile-backup" onclick="show('backup')">
        <span class="ic" style="background:#34495E"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></span>
        <b>Alles back-uppen</b>
        <small id="tile-backup-sub">Alles in één keer bewaren</small>
      </button>
    </div>
    <input class="search" id="gs-q" type="search" placeholder="Zoek overal: instellingen, notities, contacten, berichten…" aria-label="Overal zoeken" oninput="gsInput()" autocomplete="off">
    <div id="gs-res" style="display:none"></div>
    <div class="card dash" id="home-night" style="display:none"></div>
    <div class="card dash" id="home-dash" style="display:none"></div>
    <div class="hgroup" id="home-notes" style="display:none"><h3>Notities</h3><div class="tiles" id="home-notes-tiles"></div></div>
    <div class="hgroups" id="home-groups"></div>
    <p class="note" id="home-tip" style="text-align:center;margin:14px 8px 0">Tip: houd een tegel ingedrukt om er een snelkoppeling op je startscherm van te maken.</p>
    <div class="foot"><button onclick="show('homeedit')">Startscherm aanpassen</button><button onclick="show('settings')">Instellingen</button><button onclick="show('info')">Versie en updates</button></div>
  </main>
</section>
