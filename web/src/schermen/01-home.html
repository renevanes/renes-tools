<!-- ============ HOME ============ -->
<section class="screen on" id="s-home">
  <div class="hdr home sm"><button class="hsearch" onclick="tabGo('search')" aria-label="Overal zoeken"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Zoek overal</span></button>
    <h1 tabindex="-1">Tools</h1></div>
  <main>
    <div class="home-intro"><h2>Overzicht</h2><p>Je tools, bestanden en recente activiteit.</p></div>
    <div class="banner" id="upd-banner"><div class="upd-body"><div id="upd-text">Nieuwe versie beschikbaar</div><div class="upd-prog" id="upd-prog" role="progressbar" aria-label="Voortgang van de update" aria-valuemin="0" aria-valuemax="100" hidden><i></i></div></div><button id="upd-btn" onclick="installUpdate()">Installeren</button></div>
    <div class="tiles" id="tile-pool">
      <button class="tile" id="tile-redial" onclick="show('redial')">
        <span class="dot"></span>
        <span class="ic"><span class="ui-icon" data-icon="phone" aria-hidden="true"></span></span>
        <b>Auto redial</b>
        <small id="tile-redial-sub">Blijft bellen tot er wordt opgenomen</small>
      </button>
      <button class="tile" id="tile-wa" onclick="show('wa')">
        <span class="dot"></span>
        <span class="ic"><span class="ui-icon" data-icon="message" aria-hidden="true"></span></span>
        <b>WhatsApp backup</b>
        <small id="tile-wa-sub">Chats en media veilig bewaren</small>
      </button>
      <button class="tile" id="tile-tracks" onclick="show('tracks')">
        <span class="dot"></span>
        <span class="ic"><span class="ui-icon" data-icon="route" aria-hidden="true"></span></span>
        <b>Mijn routes</b>
        <small id="tile-tracks-sub">Leg je route vast met gps</small>
      </button>
      <button class="tile" id="tile-sms" onclick="show('sms')">
        <span class="ic"><span class="ui-icon" data-icon="message" aria-hidden="true"></span></span>
        <b>SMS-backup</b>
        <small id="tile-sms-sub">Bewaar je sms-berichten</small>
      </button>
      <button class="tile" id="tile-history" onclick="show('history')">
        <span class="ic"><span class="ui-icon" data-icon="bell" aria-hidden="true"></span></span>
        <b>Meldingen</b>
        <small>Bewaar en backup je meldingen</small>
      </button>
      <button class="tile" id="tile-calls" onclick="show('calls')">
        <span class="ic"><span class="ui-icon" data-icon="calls" aria-hidden="true"></span></span>
        <b>Oproepen-backup</b>
        <small id="tile-calls-sub">Bewaar je belgeschiedenis</small>
      </button>
      <button class="tile" id="tile-notes" onclick="show('notes')">
        <span class="ic"><span class="ui-icon" data-icon="notes" aria-hidden="true"></span></span>
        <b>Notities</b>
        <small id="tile-notes-sub">Lijstjes maken en afstrepen</small>
      </button>
      <button class="tile" id="tile-contacts" onclick="show('contacts')">
        <span class="ic"><span class="ui-icon" data-icon="user" aria-hidden="true"></span></span>
        <b>Contacten</b>
        <small id="tile-contacts-sub">Backup, versies en wijzigingen</small>
      </button>
      <button class="tile" id="tile-pdf" onclick="show('pdf')">
        <span class="ic"><span class="ui-icon" data-icon="document" aria-hidden="true"></span></span>
        <b>PDF</b>
        <small>Bekijken, plaatjes, splitsen, e-mail naar PDF</small>
      </button>
      <button class="tile" id="tile-kluis" onclick="show('kluis')">
        <span class="ic"><span class="ui-icon" data-icon="lock" aria-hidden="true"></span></span>
        <b>Documentenkluis</b>
        <small>Belangrijke documenten ordenen en bewaren</small>
      </button>
      <button class="tile" id="tile-car" onclick="show('car')">
        <span class="ic"><span class="ui-icon" data-icon="car" aria-hidden="true"></span></span>
        <b>Mijn auto</b>
        <small id="tile-car-sub">Parkeerplek en ritten</small>
      </button>
      <button class="tile" id="tile-recorder" onclick="show('recorder')">
        <span class="ic"><span class="ui-icon" data-icon="mic" aria-hidden="true"></span></span>
        <b>Gesprekken opnemen</b>
        <small>Handmatig of automatisch starten</small>
      </button>
      <button class="tile" id="tile-checkin" onclick="show('checkin')">
        <span class="ic"><span class="ui-icon" data-icon="smile" aria-hidden="true"></span></span>
        <b>Check-in</b>
        <small id="tile-checkin-sub">Even kort je score bijhouden</small>
      </button>
      <button class="tile" id="tile-apparaten" onclick="show('apparaten')">
        <span class="ic"><span class="ui-icon" data-icon="nearby" aria-hidden="true"></span></span>
        <b>Apparaten</b>
        <small>Bluetooth, wifi en trackers in de buurt</small>
      </button>
      <button class="tile" id="tile-sleep" onclick="show('sleep')">
        <span class="ic"><span class="ui-icon" data-icon="moon" aria-hidden="true"></span></span>
        <b>Slaappraat</b>
        <small>Hoor wat je in je slaap zegt</small>
      </button>
      <button class="tile" id="tile-gebruik" onclick="show('gebruik')">
        <span class="ic"><span class="ui-icon" data-icon="clock" aria-hidden="true"></span></span>
        <b>Gebruik</b>
        <small>Schermtijd en wat er op je telefoon gebeurde</small>
      </button>
      <button class="tile" id="tile-tr" onclick="show('transcripts')">
        <span class="ic"><span class="ui-icon" data-icon="transcript" aria-hidden="true"></span></span>
        <b>Gesprekken uitschrijven</b>
        <small id="tile-tx-sub">Opnames omzetten naar tekst</small>
      </button>
      <button class="tile" id="tile-radio" onclick="show('radio')">
        <span class="ic"><span class="ui-icon" data-icon="radio" aria-hidden="true"></span></span>
        <b>Radio</b>
        <small id="tile-radio-sub">Nederlandse zenders luisteren</small>
      </button>
      <button class="tile" id="tile-podcasts" onclick="show('podcasts')">
        <span class="ic"><span class="ui-icon" data-icon="headphones" aria-hidden="true"></span></span>
        <b>Podcasts</b>
        <small id="tile-podcasts-sub">Zoeken, volgen en luisteren</small>
      </button>
      <button class="tile" id="tile-spotify" onclick="show('spotify')">
        <span class="ic"><span class="ui-icon" data-icon="spotify" aria-hidden="true"></span></span>
        <b>Spotify-backup</b>
        <small id="tile-spotify-sub">Playlists bewaren en terugzetten</small>
      </button>
      <button class="tile" id="tile-vpn" onclick="show('vpn')">
        <span class="ic"><span class="ui-icon" data-icon="shield" aria-hidden="true"></span></span>
        <b>VPN</b>
        <small id="tile-vpn-sub">WireGuard</small>
      </button>
      <button class="tile" id="tile-loc" onclick="show('loc')">
        <span class="ic"><span class="ui-icon" data-icon="pin" aria-hidden="true"></span></span>
        <b>Locatie kiezen</b>
        <small id="tile-loc-sub">Zelf je locatie bepalen</small>
      </button>
      <button class="tile" id="tile-ai" onclick="show('ai')">
        <span class="ic"><span class="ui-icon" data-icon="sparkle" aria-hidden="true"></span></span>
        <b>Assistent</b>
        <small id="tile-ai-sub">Lokale AI, zonder internet</small>
      </button>
      <button class="tile" id="tile-music" onclick="show('music')">
        <span class="ic"><span class="ui-icon" data-icon="music" aria-hidden="true"></span></span>
        <b>Muziek herkennen</b>
        <small id="tile-music-sub">Welk nummer is dit?</small>
      </button>
      <button class="tile" id="tile-skin" onclick="Android.homeOpen()">
        <span class="ic"><span class="ui-icon" data-icon="smartphone" aria-hidden="true"></span></span>
        <b>Telefoon-skin</b>
        <small id="tile-skin-sub">Je telefoon in een nieuw jasje</small>
      </button>
      <button class="tile" id="tile-auto" onclick="show('auto')">
        <span class="ic"><span class="ui-icon" data-icon="automation" aria-hidden="true"></span></span>
        <b>Automatiseringen</b>
        <small id="tile-auto-sub">Bijv. parkeren starten bij aankomst</small>
      </button>
      <button class="tile" id="tile-backup" onclick="show('backup')">
        <span class="ic"><span class="ui-icon" data-icon="backup" aria-hidden="true"></span></span>
        <b>Alles back-uppen</b>
        <small id="tile-backup-sub">Alles in één keer bewaren</small>
      </button>
    </div>
    <div class="card dash" id="home-night" style="display:none"></div>
    <div class="card dash" id="home-dash" style="display:none"></div>
    <div class="hgroup" id="home-notes" style="display:none"><h3>Notities</h3><div class="tiles" id="home-notes-tiles"></div></div>
    <div class="hgroups" id="home-groups"></div>
    <p class="note" id="home-tip" style="text-align:center;margin:14px 8px 0">Tip: houd een tegel ingedrukt om er een snelkoppeling op je startscherm van te maken.</p>
    <div class="foot"><button onclick="show('homeedit')">Startscherm aanpassen</button><button onclick="show('info')">Versie en updates <span id="hver"></span></button></div>
  </main>
</section>
