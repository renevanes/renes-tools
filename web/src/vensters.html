<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="voice" role="dialog" aria-modal="true" aria-labelledby="voice-t">
  <div class="modal-box" style="text-align:center">
    <h3 id="voice-t">Spraaknotitie</h3>
    <button class="voicebtn" id="voice-btn" onclick="voiceToggle()" aria-label="Opnemen starten of stoppen">🎤</button>
    <p id="voice-state" class="note" role="status" aria-live="polite">Tik op de microfoon en praat. Tik nog eens als je klaar bent.</p>
    <p class="note" style="font-size:12px">Wordt op de telefoon uitgeschreven; er gaat niets naar internet.</p>
    <button class="big ghost" onclick="voiceClose()">Annuleren</button>
  </div>
</div>
<div class="undo" id="undo" role="status" aria-live="polite"><span id="undo-t"></span><button id="undo-b" type="button">Ongedaan maken</button></div>

<div class="sheet" id="sheet" onclick="if(event.target===this&&Date.now()-sheetAt>500)closeSheet()">
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><h3 id="sheet-title"></h3><p id="sheet-sub"></p><div id="sheet-acts"></div>
    <button class="cancel" onclick="closeSheet()">Annuleren</button></div>
</div>
<div class="lockscr" id="lockscr">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
  <h2>Rene's Tools is vergrendeld</h2>
  <p id="lock-msg" role="status" aria-live="polite"></p>
  <button id="lock-btn" onclick="Android.lockUnlock()">Ontgrendelen</button>
  <div class="lockpad" id="lock-pad" style="display:none">
    <div class="lockdots" id="lock-dots" aria-hidden="true"></div>
    <div class="lockkeys" id="lock-keys" role="group" aria-label="App-code"></div>
    <button class="lockbio" id="lock-bio" onclick="Android.lockBio()" style="display:none">Vingerafdruk of gezicht</button>
  </div>
</div>
<div class="modal" id="sleepdlg" onclick="if(event.target===this)sleepClose()">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="sl-t">
    <h3 id="sl-t">Slaaptimer</h3>
    <p class="note" id="sl-state" style="margin-top:0"></p>
    <div class="slval"><button class="slpm" onclick="sleepStep(-1)" aria-label="Minuut minder">−</button><span><b id="sl-min">30</b> min</span><button class="slpm" onclick="sleepStep(1)" aria-label="Minuut meer">+</button></div>
    <input type="range" class="pcseek" id="sl-range" min="1" max="240" step="1" value="30" oninput="sleepShow()" aria-label="Aantal minuten">
    <div class="chips sm" id="sl-quick" style="justify-content:center"></div>
    <button class="big ghost" id="sl-end" onclick="sleepEnd()">Aan het einde van deze aflevering</button>
    <div class="row" style="margin-top:8px"><label for="sl-time" style="flex:none">Tot</label><input type="time" id="sl-time" class="search" style="flex:1;margin:0"><button class="big ghost" style="flex:none;width:auto;padding:0 14px" onclick="sleepAt()">Instellen</button></div>
    <div class="row" id="sl-add" style="display:none;margin-top:8px"><button class="big ghost" style="flex:1" onclick="sleepAdd(5)">+5 min</button><button class="big ghost" style="flex:1" onclick="sleepAdd(15)">+15 min</button></div>
    <p class="note" style="font-size:13px">De laatste 30 seconden wordt het geluid langzaam zachter.</p>
    <div class="modal-btns">
      <button class="big ghost" id="sl-off" onclick="sleepOff()">Uitzetten</button>
      <button class="big" id="sl-go" onclick="sleepStart()">Start</button>
    </div>
  </div>
</div>
<div class="modal" id="modal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title"></h3>
    <p id="modal-text"></p>
    <input type="text" id="modal-input" class="search" aria-labelledby="modal-title" style="display:none;margin-bottom:0">
    <div class="modal-btns">
      <button class="big ghost" id="modal-cancel">Annuleren</button>
      <button class="big" id="modal-ok">OK</button>
    </div>
  </div>
</div>
