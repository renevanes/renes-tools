<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backup ontsleutelen</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--muted:#5b6478;--acc:#2b6cb0;--bad:#c53030;--ok:#2f855a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#1a2130;--ink:#e8ecf4;--muted:#9aa4b8;--acc:#63a4ff;--bad:#fc8181;--ok:#68d391}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 6px}p{color:var(--muted);margin:0 0 16px}
label{display:block;font-weight:600;margin:14px 0 6px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:16px}.chk input{width:auto;margin-top:4px}
small{color:var(--muted)}
input{width:100%;box-sizing:border-box;font:inherit;padding:12px;border-radius:10px;border:1px solid #8884;background:transparent;color:inherit}
button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:600 17px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.5}
#msg{margin-top:14px;font-weight:600}.bad{color:var(--bad)}.ok{color:var(--ok)}
</style>
</head>
<body>
<main>
<div class="card">
  <h1>Backup ontsleutelen</h1>
  <p>Zet een versleutelde backup van Rene's Tools (<b>.rtb</b>) om naar een gewoon zip-bestand. Alles gebeurt in deze browser; er gaat niets over internet.</p>
  <label for="f">Backupbestand</label>
  <input type="file" id="f" accept=".rtb">
  <label for="pw">Wachtwoord</label>
  <input type="password" id="pw" autocomplete="off">
  <label class="chk" for="geheim"><input type="checkbox" id="geheim"><span>Ook wachtwoorden en sleutels uitpakken<br><small>Standaard blijven <b>Appgegevens/geheim</b> en <b>Appgegevens/instellingen.json</b> eruit: daarin staan je VPN-sleutels, wachtwoorden en koppelingen leesbaar. Die heb je alleen nodig om Tools op een telefoon terug te zetten, en dat doet de app zelf met het .rtb-bestand.</small></span></label>
  <button id="go">Ontsleutelen</button>
  <div id="msg" role="status" aria-live="polite"></div>
</div>
</main>
<script>
const $ = s => document.querySelector(s);
const msg = (t, cls) => { $('#msg').textContent = t; $('#msg').className = cls || ''; };
const CHUNK = 65536, TAG = 16, HEADER = 33;
async function run(){
  const file = $('#f').files[0], pw = $('#pw').value;
  if (!file) return msg('Kies eerst een .rtb-bestand', 'bad');
  if (!window.crypto || !crypto.subtle) return msg('Deze browser kan niet ontsleutelen. Open dit bestand in Chrome, Edge of Firefox.', 'bad');
  $('#go').disabled = true;
  try {
    const head = new Uint8Array(await file.slice(0, HEADER).arrayBuffer());
    if (String.fromCharCode(...head.slice(0, 4)) !== 'RTB1') throw new Error('Dit is geen versleutelde backup van Rene\'s Tools');
    const dv = new DataView(head.buffer);
    const hash = head[4] === 1 ? 'SHA-256' : head[4] === 2 ? 'SHA-1' : null;
    if (!hash) throw new Error('Onbekende versie van het archief');
    const iters = dv.getUint32(5);
    if (iters < 1000 || iters > 10000000) throw new Error('Het archief is beschadigd');
    msg('Sleutel afleiden…');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: head.slice(9, 25), iterations: iters, hash}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const parts = [];
    let off = HEADER, n = 0, last = false;
    while (!last) {
      if (off + 4 > file.size) throw new Error('Het archief is onvolledig (afgebroken backup?)');
      const len = new DataView(await file.slice(off, off + 4).arrayBuffer()).getUint32(0);
      if (len < TAG || len > CHUNK + TAG || off + 4 + len > file.size) throw new Error('Het archief is onvolledig of beschadigd');
      const ct = await file.slice(off + 4, off + 4 + len).arrayBuffer();
      last = len < CHUNK + TAG;
      const iv = new Uint8Array(12); iv.set(head.slice(25, 33)); new DataView(iv.buffer).setUint32(8, n);
      const aad = new Uint8Array(HEADER + 1); aad.set(head); aad[HEADER] = last ? 1 : 0;
      try { parts.push(await crypto.subtle.decrypt({name: 'AES-GCM', iv, additionalData: aad, tagLength: 128}, key, ct)); }
      catch (e) { throw new Error(n === 0 ? 'Verkeerd wachtwoord' : 'Het archief is beschadigd'); }
      off += 4 + len; n++;
      if (last && off !== file.size) throw new Error('Het archief is beschadigd (extra gegevens na het einde)');
      if (n % 16 === 0) msg('Bezig… ' + Math.round(100 * off / file.size) + '%');
    }
    let blob = new Blob(parts, {type: 'application/zip'}), removed = 0;
    if (!$('#geheim').checked) {
      try { const r = await withoutSecrets(blob); blob = r.blob; removed = r.removed; }
      catch (e) {
        // Geen gewone zip te lezen: alleen doorgeven als er zeker geen geheimen in staan
        if (await mentions(parts, 'Appgegevens/')) throw new Error('Wachtwoorden en sleutels weglaten lukt bij dit bestand niet. Vink "Ook wachtwoorden en sleutels uitpakken" aan als je ze toch wilt.');
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file.name.replace(/\.rtb$/i, '') + '.zip';
    document.body.appendChild(a); a.click(); a.remove();
    msg('Klaar: ' + a.download + ' staat in je downloads.' + (removed ? ' ' + removed + (removed === 1 ? ' bestand' : ' bestanden') + ' met wachtwoorden en sleutels weggelaten.' : ''), 'ok');
  } catch (e) { msg(e.message || 'Ontsleutelen mislukt', 'bad'); }
  finally { $('#go').disabled = false; }
}
/* Wat nooit zomaar leesbaar uit het archief komt (zoals Secure.unpack in de app) */
const SECRET = n => n.startsWith('Appgegevens/geheim/') || n === 'Appgegevens/instellingen.json';
/* Komt deze tekst ergens in de gegevens voor? (bestandsnamen staan leesbaar in een zip) */
async function mentions(parts, text){
  const t = new TextEncoder().encode(text);
  let prev = new Uint8Array(0);
  for (const p of parts) {
    const cur = new Uint8Array(p), buf = new Uint8Array(prev.length + cur.length);
    buf.set(prev); buf.set(cur, prev.length);
    outer: for (let i = 0; i + t.length <= buf.length; i++) { for (let j = 0; j < t.length; j++) if (buf[i + j] !== t[j]) continue outer; return true; }
    prev = buf.slice(Math.max(0, buf.length - t.length + 1));
  }
  return false;
}
/* Nieuwe zip zonder de geheimen: de bestanden zelf ongewijzigd overnemen, alleen de inhoudsopgave van de zip opnieuw (ook zip64). */
async function withoutSecrets(blob){
  const size = blob.size, tailLen = Math.min(size, 65557);
  const tail = new Uint8Array(await blob.slice(size - tailLen).arrayBuffer()), T = new DataView(tail.buffer);
  let eo = -1;
  for (let i = tail.length - 22; i >= 0; i--) if (T.getUint32(i, true) === 0x06054b50) { eo = i; break; }
  if (eo < 0) throw new Error('geen zip');
  let count = T.getUint16(eo + 10, true), cdSize = T.getUint32(eo + 12, true), cdOff = T.getUint32(eo + 16, true), z64 = false;
  const eocdAbs = size - tailLen + eo;
  if (count === 0xFFFF || cdSize === 0xFFFFFFFF || cdOff === 0xFFFFFFFF) {
    const L = new DataView(await blob.slice(eocdAbs - 20, eocdAbs).arrayBuffer());
    if (L.getUint32(0, true) !== 0x07064b50) throw new Error('zip64');
    const ro = Number(L.getBigUint64(8, true)), R = new DataView(await blob.slice(ro, ro + 56).arrayBuffer());
    if (R.getUint32(0, true) !== 0x06064b50) throw new Error('zip64');
    count = Number(R.getBigUint64(32, true)); cdSize = Number(R.getBigUint64(40, true)); cdOff = Number(R.getBigUint64(48, true)); z64 = true;
  }
  const cd = new Uint8Array(await blob.slice(cdOff, cdOff + cdSize).arrayBuffer()), C = new DataView(cd.buffer), dec = new TextDecoder();
  const ents = [];
  for (let i = 0, p = 0; i < count; i++) {
    if (p + 46 > cd.length || C.getUint32(p, true) !== 0x02014b50) throw new Error('zip');
    const nl = C.getUint16(p + 28, true), xl = C.getUint16(p + 30, true), cl = C.getUint16(p + 32, true);
    const e = {name: dec.decode(cd.subarray(p + 46, p + 46 + nl)), start: p, len: 46 + nl + xl + cl, off: C.getUint32(p + 42, true), offPos: p + 42, wide: false};
    if (e.off === 0xFFFFFFFF) {
      for (let q = p + 46 + nl, end = q + xl; q + 4 <= end; ) {
        const id = C.getUint16(q, true), sz = C.getUint16(q + 2, true);
        if (id === 1) { let r = q + 4; if (C.getUint32(p + 24, true) === 0xFFFFFFFF) r += 8; if (C.getUint32(p + 20, true) === 0xFFFFFFFF) r += 8; e.off = Number(C.getBigUint64(r, true)); e.offPos = r; e.wide = true; break; }
        q += 4 + sz;
      }
      if (!e.wide) throw new Error('zip64');
    }
    ents.push(e); p += e.len;
  }
  const byOff = ents.slice().sort((a, b) => a.off - b.off);
  byOff.forEach((e, i) => { e.end = i + 1 < byOff.length ? byOff[i + 1].off : cdOff; });
  const keep = byOff.filter(e => !SECRET(e.name)), removed = byOff.length - keep.length;
  if (!removed) return {blob, removed: 0};
  const out = [], cds = [];
  let pos = 0;
  for (const e of keep) {
    out.push(blob.slice(e.off, e.end));
    const rec = cd.slice(e.start, e.start + e.len), V = new DataView(rec.buffer), at = e.offPos - e.start;
    if (e.wide) V.setBigUint64(at, BigInt(pos), true); else V.setUint32(at, pos, true);
    cds.push(rec); pos += e.end - e.off;
  }
  const newCdSize = cds.reduce((n, r) => n + r.length, 0), n = keep.length, tailParts = [];
  if (z64) {
    const r = new DataView(new ArrayBuffer(56));
    r.setUint32(0, 0x06064b50, true); r.setBigUint64(4, 44n, true); r.setUint16(12, 45, true); r.setUint16(14, 45, true);
    r.setBigUint64(24, BigInt(n), true); r.setBigUint64(32, BigInt(n), true); r.setBigUint64(40, BigInt(newCdSize), true); r.setBigUint64(48, BigInt(pos), true);
    const l = new DataView(new ArrayBuffer(20));
    l.setUint32(0, 0x07064b50, true); l.setBigUint64(8, BigInt(pos + newCdSize), true); l.setUint32(16, 1, true);
    tailParts.push(r.buffer, l.buffer);
  }
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, z64 ? 0xFFFF : n, true); e.setUint16(10, z64 ? 0xFFFF : n, true);
  e.setUint32(12, z64 ? 0xFFFFFFFF : newCdSize, true); e.setUint32(16, z64 ? 0xFFFFFFFF : pos, true);
  tailParts.push(e.buffer);
  return {blob: new Blob([...out, ...cds, ...tailParts], {type: 'application/zip'}), removed};
}
$('#go').onclick = run;
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
