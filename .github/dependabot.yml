# Dependabot houdt de GitHub Actions in de workflows bij (wekelijks, in één pull request).
# Kleine updates (patch/minor) voegt de workflow "Dependabot samenvoegen" vanzelf samen zodra "Bouwen en testen"
# slaagt; grote updates (major) blijven open voor het wekelijkse onderhoud door een agent.
# De meegeleverde bibliotheken (web/vendor, app/lib) kent Dependabot niet: die controleert de workflow "Onderhoud".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: "Onderhoud"
    labels: [onderhoud]
    groups:
      actions:
        patterns: ["*"]
