# Beveiligingsscan met CodeQL: Java (app/src) en JavaScript (web/src). Bij elke push naar main, bij pull requests
# en elke week, zodat nieuwe controles van GitHub ook oude code nalopen. Bevindingen staan onder Security →
# Code scanning; het wekelijkse onderhoud door een agent lost ze op.
name: Beveiligingsscan

on:
  push:
    branches: [main]
    paths: ['app/**', 'web/**', '.github/workflows/beveiligingsscan.yml']
  pull_request:
    paths: ['app/**', 'web/**']
  schedule:
    - cron: '17 4 * * 1'   # maandag 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none          # geen Gradle nodig; CodeQL leest de bron direct
          queries: security-extended
          config: |
            paths-ignore:
              - web/vendor
              - web/index.html
              - update
              - tests

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
