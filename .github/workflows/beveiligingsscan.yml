# Beveiligingsscan met CodeQL: Java (app/src) en JavaScript (web/src). Bij elke push naar main, bij pull requests
# en elke week, zodat nieuwe controles van GitHub ook oude code nalopen. Bevindingen staan onder Security →
# Code scanning; het wekelijkse onderhoud door een agent lost ze op.
name: Beveiligingsscan

on:
  push:
    branches: [main]
    paths: ['app/**', 'web/**', 'tools/llm/**', '.github/workflows/beveiligingsscan.yml']
  pull_request:
    paths: ['app/**', 'web/**', 'tools/llm/**']
  schedule:
    - cron: '17 4 * * 1'   # maandag 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript, c-cpp]   # c-cpp: onze eigen AI-motor (tools/llm/llm.cpp)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none          # geen Gradle nodig; CodeQL leest de bron direct
          queries: security-extended
          config: |
            paths-ignore:
              - web/vendor
              - web/index.html
              - update
              - tests

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
