# Wekelijkse momentopname van toiletten en douches in Nederland uit OpenStreetMap (ODbL), voor de tool
# "Toiletten en douches". Haalt het Nederland-extract van Geofabrik, filtert het met osmium (tools/toiletten/ophalen.py
# + regels.json) en zet toiletten-nl.json.gz en meta.json in de GitHub-release "toiletten-gegevens". De telefoons
# halen het daar zelf op (Toiletten → Bronnen → OpenStreetMap Nederland), alleen het bestand, nooit met hun locatie.
# Geen geheimen en geen environment: deze workflow raakt de app en de ondertekeningssleutel niet.
# Twee taken: "maken" verwerkt gegevens van buiten (osmium) en mag niets schrijven; alleen "vrijgeven" krijgt het
# schrijfrecht, controleert de bestanden en zet ze in de release.
name: Toiletten-gegevens

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toiletten-gegevens.yml'
      - 'tools/toiletten/**'
      - 'web/toiletten-bronnen.json'
  schedule:
    - cron: '23 2 * * 2'   # dinsdag 02:23 UTC (Geofabrik heeft het extract van maandag dan klaar)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toiletten-gegevens
  cancel-in-progress: false

jobs:
  maken:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: osmium-tool installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Nederland-extract van Geofabrik (met controle)
        run: |
          set -euo pipefail
          url=https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
          curl -fsSL --retry 3 -A "renes-tools-toiletten/1 (+https://github.com/$REPO)" -o nl.osm.pbf "$url"
          curl -fsSL --retry 3 -o nl.osm.pbf.md5 "$url.md5"
          echo "$(cut -d' ' -f1 nl.osm.pbf.md5)  nl.osm.pbf" | md5sum -c -

      - name: Testplekken kloppen nog met de regels
        run: |
          python3 -m unittest discover -s tests/toiletten -v
          python3 tools/toiletten/ophalen.py --voorbeeld tools/toiletten/voorbeeld.json

      - name: Momentopname maken
        run: |
          python3 tools/toiletten/ophalen.py --pbf nl.osm.pbf --uit uit
          python3 tools/toiletten/controleren.py uit
          cat uit/meta.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: momentopname
          path: |
            uit/toiletten-nl.json.gz
            uit/meta.json
          if-no-files-found: error
          retention-days: 3

  vrijgeven:
    needs: maken
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # alleen om de release-bestanden bij te werken
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: toiletten-gegevens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: momentopname
          path: uit

      - name: Controleren (formaat, grootte, aantal en controlegetal)
        run: python3 tools/toiletten/controleren.py uit

      - name: Release bijwerken (eerst het bestand, dan meta.json)
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --latest=false --title "Toiletten en douches (OpenStreetMap)" \
              --notes "Wekelijkse momentopname voor de tool Toiletten en douches. Gegevens: © OpenStreetMap-bijdragers, ODbL 1.0 (https://www.openstreetmap.org/copyright). Gemaakt door .github/workflows/toiletten-gegevens.yml."
          fi
          gh release upload "$TAG" -R "$REPO" --clobber uit/toiletten-nl.json.gz
          gh release upload "$TAG" -R "$REPO" --clobber uit/meta.json

  bronnen:
    needs: vrijgeven
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sjablonen controleren (adressen, formaat, velden en actualiteit)
        run: |
          controle_status=0
          python3 tools/toiletten/bronnen_controleren.py --uit bronnen.json > bronnen.md || controle_status=$?
          cat bronnen.md >> "$GITHUB_STEP_SUMMARY"
          exit "$controle_status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bronnencontrole
          path: |
            bronnen.json
            bronnen.md
          if-no-files-found: error
          retention-days: 30
