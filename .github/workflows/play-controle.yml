name: Play-controle

on:
  pull_request:
    paths: ['app/**', 'web/**', 'play/**', 'build*.sh', 'tests/**', '.github/workflows/play-controle.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: play-controle-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  play:
    name: Play naast volledige app (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    env:
      TOOLS: ${{ github.workspace }}/../toolchain
      # De emulator is x86_64: de lokale stem daarvoor ook meebouwen (de gepubliceerde APK heeft alleen arm64-v8a).
      VOORLEZEN_ABIS: arm64-v8a x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Releasecontroles testen
        run: python3 -m unittest discover -s play -p 'test_*.py'
      - name: Bouwgereedschap
        run: ./setup-tools.sh
        env:
          CI: 'true'
      - name: Tijdelijke testsleutel en beide apps bouwen
        run: |
          echo 'testsleutel-alleen-voor-ci' > keys/keystore.pass
          keytool -genkeypair -keystore keys/release.p12 -storetype PKCS12 -alias release -storepass:file keys/keystore.pass -keypass:file keys/keystore.pass -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=CI-test'
          ./build.sh
          PLAY_KS=keys/release.p12 PLAY_KS_PASS_FILE=keys/keystore.pass PLAY_KS_ALIAS=release ./build-play.sh
          source VERSION
          BUNDLETOOL="$TOOLS/bundletool-1.18.3.jar"
          java -jar "$BUNDLETOOL" build-apks --bundle="build-play/Renes-Tools-play-v$VERSION_NAME.aab" --output=build-play/test.apks --mode=universal --ks=keys/release.p12 --ks-key-alias=release --ks-pass=file:keys/keystore.pass --key-pass=file:keys/keystore.pass
          unzip -p build-play/test.apks universal.apk > build-play/play-test.apk
          java -jar "$BUNDLETOOL" dump manifest --bundle="build-play/Renes-Tools-play-v$VERSION_NAME.aab" --module=base > build-play/test-manifest.xml
      - name: KVM aanzetten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Naast elkaar installeren en Play starten
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tests/telefoon/playtest.sh
      - name: Testbundel en telefoonresultaten bewaren
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-test-api-${{ matrix.api }}
          path: |
            build-play/*.aab
            build-play/telefoon/
            build-play/idcopy-test/**/result.txt
            build-play/masterdata-test/**/result.txt
            build-play/voorlezen-test/**/result.txt
            build-play/voorlezen-test/**/logcat.txt
          retention-days: 14
          if-no-files-found: ignore
