# Voegt pull requests van Dependabot vanzelf samen, maar alleen als:
#  - "Bouwen en testen" op die pull request geslaagd is,
#  - de auteur echt dependabot[bot] is en alleen bestanden in .github/workflows/ veranderen,
#  - het uitsluitend kleine updates zijn (patch/minor; niets van de vorm "from 4 to 5").
# Grote updates blijven open; die pakt het wekelijkse onderhoud door een agent op (zie AGENTS.md, "Onderhoud").
# Deze workflow checkt geen code van de pull request uit en draait die ook niet.
name: Dependabot samenvoegen

on:
  workflow_run:
    workflows: ["Bouwen en testen"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  samenvoegen:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Controleren en samenvoegen
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number,author,headRefOid \
                 --jq ".[] | select(.author.login == \"app/dependabot\" and .headRefOid == \"$SHA\") | .number" | head -1)
          if [ -z "$pr" ]; then echo "Geen open Dependabot-pull request met deze commit; niets te doen."; exit 0; fi

          files=$(gh pr diff "$pr" -R "$REPO" --name-only)
          if echo "$files" | grep -qvE '^\.github/workflows/'; then
            echo "Verandert meer dan workflows; laten staan voor een mens of agent:"; echo "$files"; exit 0
          fi

          body=$(gh pr view "$pr" -R "$REPO" --json body --jq .body)
          groot=$(printf '%s\n' "$body" | python3 -c '
          import re, sys
          tekst = sys.stdin.read()
          paren = re.findall(r"from `?v?(\d+)[^ `]*`? to `?v?(\d+)", tekst)
          print("ja" if not paren or any(a != b for a, b in paren) else "nee")
          ')
          if [ "$groot" = "ja" ]; then
            echo "Grote update (of onbekend): niet vanzelf samenvoegen."
            gh pr edit "$pr" -R "$REPO" --add-label "grote-update" || true
            exit 0
          fi

          gh pr merge "$pr" -R "$REPO" --merge --match-head-commit "$SHA" --delete-branch
          echo "Pull request #$pr samengevoegd."
