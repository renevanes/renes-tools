# Bouwt de app en draait alle tests bij elke wijziging (en met de hand via "Run workflow").
# Dit is een controle: de APK wordt ondertekend met een tijdelijke testsleutel, niet met de echte
# sleutel. Echte updates publiceert de workflow Publiceren (publiceren.yml).
name: Bouwen en testen

on:
  push:
    branches-ignore: [publiceren-slot, publiceren-bezig]  # publicatieslot van ./publish.sh: geen code
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOOLS: ${{ github.workspace }}/../toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Pull request mag geen versie of update/ bevatten (dat doet alleen ./publish.sh)
        if: github.event_name == 'pull_request'
        run: |
          bad=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(VERSION|changelog\.json|update/)' || true)
          if [ -n "$bad" ]; then echo "Deze bestanden maakt alleen ./publish.sh:"; echo "$bad"; exit 1; fi
          if cat wijzigingen/*.txt 2>/dev/null | grep -qiE '(^|[^[:alpha:]])n[e]p'; then echo 'Het woord n-e-p (fake) mag niet in wijzigingen/'; exit 1; fi

      - name: Actions vastgezet op een commit (niet op een verplaatsbaar versienummer)
        run: |
          mapfile -d '' -t action_files < <(git ls-files -z '.github/workflows/*.yml' '.github/workflows/*.yaml' '.github/actions/*/action.yml' '.github/actions/*/action.yaml')
          los=$(grep -n -E '^\s*-?\s*uses:' "${action_files[@]}" \
                | grep -v -E '@[0-9a-f]{40}( |$)' | grep -v -E 'uses:\s*\./' || true)  # eigen (lokale) actions mogen
          if [ -n "$los" ]; then echo "$los"; echo "::error::Zet elke Action vast op een commit-SHA met de versie als opmerking (zie AGENTS.md)"; exit 1; fi

      - name: Scripts controleren (shellcheck; fouten stoppen, waarschuwingen alleen als melding)
        run: |
          shellcheck --version | head -2
          mapfile -d '' -t scripts < <(git ls-files -z '*.sh')
          shellcheck -S warning -f gcc "${scripts[@]}" | sed -E 's/^([^:]+):([0-9]+):[0-9]+: (warning|note|info): (.*)$/::warning file=\1,line=\2::\4/' || true
          shellcheck -S error "${scripts[@]}"

      - name: Versies van meegeleverde onderdelen leesbaar (voor de onderhoudscontrole)
        run: python3 .github/scripts/onderhoud-controle.py --bestanden

      - name: Publicatie mag alleen geteste bron gebruiken
        run: bash tests/publicatie-bron.sh

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Bouwgereedschap ophalen (build-tools, aapt2, android.jar)
        run: ./setup-tools.sh

      - name: Tijdelijke testsleutel maken
        run: |
          echo "testsleutel-alleen-voor-ci" > keys/keystore.pass
          keytool -genkeypair -keystore keys/release.p12 -storetype PKCS12 -alias release \
            -storepass testsleutel-alleen-voor-ci -keypass testsleutel-alleen-voor-ci \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=CI-test"

      - name: App bouwen
        run: ./build.sh

      - name: Logica-tests (Java)
        run: |
          set -o pipefail
          mkdir -p build && ./tests/run-jvm.sh 2>&1 | tee build/ci-jvm.log

      - name: Playwright installeren
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Interfacetests (Playwright, licht en donker)
        run: |
          set -o pipefail
          ./tests/run-ui.sh 2>&1 | tee build/ci-ui.log

      # De logboeken van een run zijn niet altijd te lezen (ook niet voor agents): zet de mislukte tests en hun
      # foutregels daarom als melding bij de run en in de samenvatting.
      - name: Wankele tests melden (slaagden pas bij de tweede poging)
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path('build/ci-ui.log')
          if path.is_file():
              for line in path.read_text(errors='replace').splitlines():
                  m = re.match(r'↻ ([A-Za-z0-9_.-]{1,128}) ', line)
                  if m:
                      print('::warning title=Wankele test::' + m[1])
          PY

      - name: Mislukte tests benoemen
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, re
          uit = []
          for name in ('ci-jvm.log', 'ci-ui.log'):
              path = pathlib.Path('build') / name
              if not path.is_file():
                  continue
              regels = path.read_text(errors='replace').splitlines()
              for i, line in enumerate(regels):
                  m = re.fullmatch(r'✗ ([A-Za-z0-9_.-]{1,128})', line)
                  if m:
                      blok = [r.strip() for r in regels[i + 1:i + 40] if r.strip() and not r.strip().startswith('at ')]
                      plek = [r for r in regels[i + 1:i + 40] if '.test.js:' in r][:1]  # regel in de test
                      fout = blok[:6] + [p.strip() for p in plek]
                      tekst = ' | '.join(x.strip()[:200] for x in fout).replace('%', '%25').replace('\r', '').replace('\n', ' ')
                      print(f'::error title=Mislukte test::{m[1]}: {tekst}')
                      uit.append(f'### {m[1]}\n```\n' + '\n'.join(regels[i + 1:i + 26]) + '\n```')
          if uit:
              with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('## Mislukte tests\n\n' + '\n\n'.join(uit) + '\n')
          PY

      - name: Test-APK en schermafdrukken bewaren
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renes-tools-test-build
          path: |
            Renes-Tools-v*.apk
            tests/ui/shots/*.png
            build/ci-*.log
          retention-days: 14
