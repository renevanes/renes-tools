# Bouwt de app en draait alle tests bij elke wijziging (en met de hand via "Run workflow").
# Dit is een controle: de APK wordt ondertekend met een tijdelijke testsleutel, niet met de echte
# sleutel. Echte updates publiceert de workflow Publiceren (publiceren.yml).
name: Bouwen en testen

on:
  push:
    branches-ignore: [publiceren-slot, publiceren-bezig]  # publicatieslot van ./publish.sh: geen code
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOOLS: ${{ github.workspace }}/../toolchain
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pull request mag geen versie of update/ bevatten (dat doet alleen ./publish.sh)
        if: github.event_name == 'pull_request'
        run: |
          bad=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(VERSION|changelog\.json|update/)' || true)
          if [ -n "$bad" ]; then echo "Deze bestanden maakt alleen ./publish.sh:"; echo "$bad"; exit 1; fi
          if cat wijzigingen/*.txt 2>/dev/null | grep -qiE '(^|[^[:alpha:]])n[e]p'; then echo 'Het woord n-e-p (fake) mag niet in wijzigingen/'; exit 1; fi

      - name: Versies van meegeleverde onderdelen leesbaar (voor de onderhoudscontrole)
        run: python3 .github/scripts/onderhoud-controle.py --bestanden

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Bouwgereedschap ophalen (build-tools, aapt2, android.jar)
        run: ./setup-tools.sh

      - name: Tijdelijke testsleutel maken
        run: |
          echo "testsleutel-alleen-voor-ci" > keys/keystore.pass
          keytool -genkeypair -keystore keys/release.p12 -storetype PKCS12 -alias release \
            -storepass testsleutel-alleen-voor-ci -keypass testsleutel-alleen-voor-ci \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=CI-test"

      - name: App bouwen
        run: ./build.sh

      - name: Logica-tests (Java)
        run: ./tests/run-jvm.sh

      - name: Playwright installeren
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Interfacetests (Playwright, licht en donker)
        run: ./tests/run-ui.sh

      - name: Test-APK en schermafdrukken bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renes-tools-test-build
          path: |
            Renes-Tools-v*.apk
            tests/ui/shots/*.png
          retention-days: 14
